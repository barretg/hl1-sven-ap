# Verification seed 4 of 5 — DeathLink, two slots
#
# From "Still open — 08/14/26":
#
#   5. One explosion killing several players still sends exactly one DeathLink
#
# The other open DeathLink item -- that with `death_link: false` a death takes
# nobody with it -- cannot be tested here, because both slots below have it on.
# Every other seed in this folder has it off, so it is checked there: die on
# seed 1, 2, 3 or 5 and nobody else in the lobby should be gibbed. The wipe was
# happening regardless of the option, which is the bug that item guards.
#
# Two documents, so one generation gives two slots on DeathLink. Both start with
# an RPG and a mission to stand around in, because the test is a single explosion
# killing several players at once and you have to be able to cause one.
#
# Amnesty starts at 2, which is the order to work through:
#   1. Die once, then again  — chat counts down, nothing leaves the lobby
#   2. In the client:  /amnesty 0
#   3. Die once more          — one DeathLink goes out immediately
#   4. Gather both players and fire an RPG at your feet: still exactly one
#      DeathLink in the log, not one per player
#
# The checklist says four players; two is enough to prove the same thing, since
# what is being tested is one report per event rather than per corpse. Add more
# players to the lobby if you have them.
#
# Steps 1 to 3 have already passed; step 4 is the one still open.
#
# Slot B also carries `lobby_death_link: off`, which is the new setting: the two
# halves of DeathLink pulled apart. B's deaths must still send a DeathLink to A
# and must gib nobody in the lobby; A's deaths gib everyone as before. An
# inbound DeathLink takes the lobby either way, whichever slot receives it.
# `non_arcade` is the third setting and needs Suspension to test, so it belongs
# with seed 5.

name: Ver4DeathA
description: DeathLink slot A
game: Half-Life (Sven Co-op)
requires:
  version: 0.6.7

Half-Life (Sven Co-op):
  include_half_life: true
  missions_required: 1
  chargesanity: false
  exclude_intro_missions: true
  logic_difficulty: loose
  trap_percentage: 0
  death_link: true
  death_link_amnesty: 2
  # The ordinary behaviour: this slot's deaths take the lobby with them.
  lobby_death_link: on
  start_inventory:
    Office Complex Unlock: 1
    RPG: 1
    Glock: 1

---

name: Ver4DeathB
description: DeathLink slot B
game: Half-Life (Sven Co-op)
requires:
  version: 0.6.7

Half-Life (Sven Co-op):
  include_half_life: true
  missions_required: 1
  chargesanity: false
  exclude_intro_missions: true
  logic_difficulty: loose
  trap_percentage: 0
  death_link: true
  death_link_amnesty: 2
  # The half of DeathLink this slot keeps: it reports its deaths and takes
  # nobody with it. Slot A above is the ordinary "everyone goes" behaviour, so
  # one lobby shows both.
  lobby_death_link: off
  start_inventory:
    Office Complex Unlock: 1
    RPG: 1
    Glock: 1
