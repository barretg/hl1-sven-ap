# Verification seed 1 of 5 — endgame credit, pass-through, and the reconnect
#
# This one carries most of what is still open. From "Still open — 08/14/26":
#
#   0.  A Leap Of Faith is credited when it ends, not when it loads
#   0.  Worlds Collide is credited when it ends too
#   4.  A carried-through mission sends nothing, even unlocked
#   retest: a finale is not credited on arrival
#   retest: a carried-through mission sends nothing, unlocked or not
#   retest: holding a weapon does not send its check
#   retest: loadout ammo arrives in one step at half of maximum
#   retest: missions the seed left out are absent from !ap
#   retest: releasing a mission's completion from the server applies in game
#   retest: reconnecting is safe
#   5.  with death_link off, dying takes nobody with you (this seed has it off)
#
# Three campaigns, each sealed one or two missions from its finale, and the
# unlocks handed over up front so every ending is a short trip rather than a run.
# They Hunger is left out on purpose: it must not appear in `!ap` at all.
#
# Order to work through:
#
#   1. `!ap`  — no They Hunger, and no "not in this seed" lines anywhere. Its
#      heading should be missing too, not empty.
#   2. Spawn and listen. The eight weapons below arrive at half their maximum
#      ammo in one step per weapon, not a long crawl of pickup sounds. Die and
#      respawn: the same, and nobody else in the lobby is gibbed.
#   3. Stand in Office Complex holding the shotgun. Nothing sends — the check
#      belongs to the copy on the floor, not the one in your hands. Walk over
#      that copy: it sends.
#   4. Clear Unforeseen Consequences. Office Complex must stay silent as the
#      campaign carries you through it, though it is unlocked, and you should be
#      bounced back to the hub. If it does send, the console says why: look for
#      `carried into ... ; not playing it` or `FATAL: could not queue the hub
#      return`.
#   5. From the Archipelago server console, release Crush Depth's "- Complete"
#      location. `!ap` must count it toward Worlds Collide's seal without the
#      mission having been played.
#   6. `!warp` into of6a4b, then leave with `!hub`. Nothing is credited. Go back,
#      press the button by the guard, and the credit lands after the map ends.
#   7. Same shape for Blue Shift: clear Insecurity, then Power Struggle, then
#      warp into A Leap Of Faith and leave — nothing. Play it to the credits and
#      everything lands after the map's game_end.
#   8. Disconnect the client and connect a different slot. The lobby returns to
#      the hub, and the new slot's first checks send rather than being swallowed
#      as ones this session had already sent.

name: Ver1Endgames
description: endgame credit, separate counts, no chargers
game: Half-Life (Sven Co-op)
requires:
  version: 0.6.7

Half-Life (Sven Co-op):
  include_half_life: true
  include_opposing_force: true
  include_blue_shift: true
  include_they_hunger: false

  # Low enough that each finale is one or two missions away.
  missions_required: 1
  opposing_force_missions_required: 2
  blue_shift_missions_required: 1

  chargesanity: false
  exclude_intro_missions: true
  logic_difficulty: loose
  trap_percentage: 0
  shuffle_hev_suit: false
  # On, so `ungated=` should carry no item_longjump. Seed 3 has it off.
  shuffle_longjump: true

  start_inventory:
    # Half-Life: the pair that proves a carried-through mission credits nothing.
    Unforeseen Consequences Unlock: 1
    Office Complex Unlock: 1
    # Opposing Force: two short missions to meet its count of 2.
    Welcome To Black Mesa Unlock: 1
    Crush Depth Unlock: 1
    # Blue Shift: one mission to open Power Struggle, and A Leap Of Faith behind it.
    Insecurity Unlock: 1
    # Enough firepower that none of the above is a fight for its own sake.
    Glock: 1
    MP5: 1
    Shotgun: 1
    .357 Magnum: 1
    RPG: 1
    Crossbow: 1
    Tau Cannon: 1
    Gluon Gun: 1
    Snarks: 1
