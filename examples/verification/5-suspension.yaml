# Verification seed 5 of 5 — Suspension, third pass
#
# The first pass found nearly all of this broken. The second found the locks
# silent, the medals missing, the clear looping and the goal wrong. Everything
# below has changed since; none of it has passed yet.
#
# Capped at medium, so exactly one Progressive Suspension Difficulty item exists
# and the lobby starts able to vote easy and nothing else. Nothing is in the
# starting inventory but the starting class: the other six arrive as items, and
# the Juggernaut is not an item at all -- the map opens it once a run has been
# cleared with each of the other seven.
#
# `/send Ver5Suspension <item>` from the server console is how to skip ahead;
# `Suspension: Engineer` is the one worth having early, since nothing past
# section 1 can be finished without explosives.
#
# Order to work through:
#
#   1. `!ap`. Suspension is listed under an Arcade heading with `!warp
#      suspension` beside it, and there are no missions in the list at all --
#      every campaign is off, so this seed is the bridge and nothing else.
#   2. `!warp susp`. Part of the name is enough; it used to need all of it.
#   3. On arrival, chat names the difficulties and classes that are open.
#      Only easy, and only the starting class.
#   4. Vote buttons. Easy is pressable. Press medium: it is *there* and refuses
#      out loud, one line per press rather than a stream, and no vote is cast.
#   5. Class booths. A locked one is a wall that says "You have not found the
#      Sniper yet" in the centre of the screen, and you are never left standing
#      inside a booth. `/send` a class and its booth opens without a map reload.
#   6. The lobby display. The Juggernaut icon is the placeholder until the seven
#      clears are done, and it does not flash between the two.
#   7. Start an easy round. The server console should show
#         suspension: tier voted easy
#      If it never does, the counters are not being driven and nothing else here
#      can pass. That is the one assumption everything rests on.
#   8. Watch each section fall and confirm the check lands with it, not one
#      section early or late, and that it names the class you were holding for
#      *that* section. The names are the lobby's: Assault, Grenadier, Pointman,
#      Support, Sniper, Medic, Engineer, Juggernaut.
#   9. Switch class between sections at least once. The section checks follow
#      what you were holding at the time; nothing is credited retroactively.
#  10. Finish the round. **One** "cleared on easy" line, not a stream of them.
#      The medal lands as a check and every easier medal lands with it. The
#      clear is credited to whichever class you spent most of the run as. Then
#      the server comes back to the bridge rather than wandering into its map
#      cycle.
#  11. Clear a run with each of the other classes. After the seventh, the
#      Juggernaut booth opens on its own -- no item arrives, because there is no
#      item.
#  12. From the Archipelago server console:
#         /send Ver5Suspension Progressive Suspension Difficulty
#      The medium button becomes pressable without a map reload.
#  13. Clear a medium run with each of the eight classes. The eighth is the
#      goal: the client reports it, and with no campaigns in this seed that
#      wins the slot outright.
#
# Also worth a glance while you are here: dying must not gib the rest of the
# lobby, since this seed has DeathLink off.
#
# Every campaign is off. A seed normally falls back to Half-Life when nothing is
# enabled, but Suspension counts as content in its own right, so this is a seed
# with nothing in it but the bridge -- no campaign checks to wade through and no
# hub missions to distract from what is being tested.

name: Ver5Suspension
description: the arcade map, from the vote buttons through to its goal
game: Half-Life (Sven Co-op)
requires:
  version: 0.6.7

Half-Life (Sven Co-op):
  include_half_life: false
  include_opposing_force: false
  include_blue_shift: false
  include_they_hunger: false
  chargesanity: false
  trap_percentage: 0

  suspension: true
  # On, so sections are credited per class and step 8 above has something to
  # show. Every section then exists once per class per tier.
  suspension_classanity: true
  # Two tiers: easy open from the start, medium behind the one Progressive item.
  # Medium is also the highest the option's own advice recommends.
  suspension_max_difficulty: medium
  # Reachable without a flawless run, so the medal test does not need one.
  suspension_required_award: bronze
  # Off, so the goal is eight clears at medium and nothing about the medal. Turn
  # it on and every one of those clears has to earn bronze as well.
  suspension_goal_requires_award: false
  # Off, so a medium clear sends medium only and the two tiers stay legible.
  suspension_difficulty_rolldown: false
  suspension_max_awards_are_priority: false
  suspension_starting_class: assault
