# Verification seed 2 of 5 — a seed with no Half-Life in it
#
# Everything this seed was written for has passed. It is kept as the regression
# seed for the campaign-independence work, and it carries one open item:
#
#   retest: missions the seed left out are absent from !ap
#
# That is the strongest case there is for it -- three of the four campaigns are
# off, so `!ap` should be a short list of Opposing Force and They Hunger and
# nothing else. No "not in this seed" lines, and no empty campaign headings.
#
# Already passed, and what would break if it regressed:
#
#   * Shared weapons arrive without Half-Life. The Shotgun in the starting
#     inventory is the guard: the bug was an Opposing Force seed containing
#     shotguns but no Shotgun item, so every one was refused for the whole run.
#     Walk over one in of1a1 and it must be collectable.
#   * The rolled melee weapon never arrives as an item, because it left the pool.
#   * allow_restricted_starting_weapon can roll They Hunger's spanner, which
#     means empty hands outside They Hunger until a weapon arrives. That is the
#     documented rough edge rather than a bug.
#
# Opposing Force and They Hunger together, so the melee roll has three
# candidates -- Crowbar, Pipe Wrench, Spanner. Check the spoiler's Starting
# Items before playing; a Crowbar roll makes the last two vacuous, so regenerate
# if you want them exercised.

name: Ver2NoHalfLife
description: shared weapons and the rolled melee weapon, with Half-Life switched off
game: Half-Life (Sven Co-op)
requires:
  version: 0.6.7

Half-Life (Sven Co-op):
  include_half_life: false
  include_opposing_force: true
  include_blue_shift: false
  include_they_hunger: true

  random_starting_weapon: true
  allow_restricted_starting_weapon: true

  missions_required: 1
  opposing_force_missions_required: 1
  they_hunger_missions_required: 1

  chargesanity: false
  exclude_intro_missions: true
  logic_difficulty: loose
  trap_percentage: 0

  start_inventory:
    # The item under test: it must exist in a seed with no Half-Life.
    Shotgun: 1
    # One map of each campaign to walk around in.
    Welcome To Black Mesa Unlock: 1
    "They Hunger: Episode 1 Unlock": 1
